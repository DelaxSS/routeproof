server {
    listen 80;
    server_name app.example.com;

    location /admin/ {
        auth_basic "Admin";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://admin_backend;
    }

    location ~* /[^/]+\.json$ {
        proxy_pass http://static_backend;
    }

    location /static {
        alias /var/www/static/;
    }
}
